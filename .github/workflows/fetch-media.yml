name: Fetch Media

on:
  repository_dispatch:
    types: [fetch-media]

# 20 concurrent jobs max on Free plan — this prevents queue pile-up
concurrency:
  group: fetch-${{ github.event.client_payload.key_base }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js for BotGuard PO token solver
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yt-dlp, ffmpeg, boto3, and build BGUtil POT provider
        run: |
          pip install -U "yt-dlp[default]" curl_cffi boto3 bgutil-ytdlp-pot-provider
          sudo apt-get update && sudo apt-get install -y ffmpeg
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git $HOME/bgutil-ytdlp-pot-provider
          cd $HOME/bgutil-ytdlp-pot-provider/server
          npm ci
          npx tsc

      - name: Download media
        id: download
        env:
          MEDIA_URL: ${{ github.event.client_payload.url }}
          QUALITY: ${{ github.event.client_payload.quality }}
          KEY_BASE: ${{ github.event.client_payload.key_base }}
          USER_COOKIES: ${{ github.event.client_payload.cookies }}
          SERVER_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          
          COOKIES="${USER_COOKIES:-$SERVER_COOKIES}"

          python3 scripts/download_media.py \
            --url "$MEDIA_URL" \
            --quality "$QUALITY" \
            --cookies "$COOKIES"

          FILE=$(ls -1 output.* | head -1)
          EXT="${FILE##*.}"
          if [ "$EXT" = "mp3" ]; then
            MIME="audio/mpeg"
          else
            MIME="video/mp4"
          fi

          # Oversized file guard (500 MB)
          FILESIZE=$(stat -c%s "$FILE")
          if [ "$FILESIZE" -gt 524288000 ]; then
            echo "File too large: ${FILESIZE} bytes"
            exit 2
          fi

          TITLE=$(head -n 1 title.txt 2>/dev/null || echo "media")
          if [ -z "$TITLE" ]; then TITLE="media"; fi

          echo "file=${FILE}" >> $GITHUB_OUTPUT
          echo "ext=${EXT}" >> $GITHUB_OUTPUT
          echo "mime=${MIME}" >> $GITHUB_OUTPUT
          echo "size=${FILESIZE}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Upload to R2
        if: success()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          KEY_BASE: ${{ github.event.client_payload.key_base }}
          FILE: ${{ steps.download.outputs.file }}
          EXT: ${{ steps.download.outputs.ext }}
          MIME: ${{ steps.download.outputs.mime }}
        run: |
          python3 scripts/r2_put.py \
            --account-id "$R2_ACCOUNT_ID" \
            --access-key "$R2_ACCESS_KEY" \
            --secret-key "$R2_SECRET_KEY" \
            --key "${KEY_BASE}.${EXT}" \
            --file "$FILE" \
            --content-type "$MIME"

      - name: Update KV index
        if: success()
        env:
          CF_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KEY_BASE: ${{ github.event.client_payload.key_base }}
          EXT: ${{ steps.download.outputs.ext }}
          MIME: ${{ steps.download.outputs.mime }}
          SIZE: ${{ steps.download.outputs.size }}
          TITLE: ${{ steps.download.outputs.title }}
        run: |
          python3 -c "
          import json, subprocess, os, time
          account_id = os.environ['CF_ACCOUNT_ID']
          namespace_id = os.environ['CF_KV_NAMESPACE_ID']
          api_token = os.environ['CF_API_TOKEN']
          key_base = os.environ['KEY_BASE']
          ext = os.environ['EXT']
          mime = os.environ['MIME']
          size = int(os.environ['SIZE'])
          title = os.environ.get('TITLE', 'media')

          val = json.dumps({
              'ext': ext,
              'mime': mime,
              'size': size,
              'title': title,
              'cached_at': int(time.time())
          })
          subprocess.run([
              'python3', 'scripts/kv_put.py',
              '--account-id', account_id,
              '--namespace-id', namespace_id,
              '--api-token', api_token,
              '--key', f'media:{key_base}',
              '--value', val
          ], check=True)
          "

      - name: Clean up pending + report failure
        if: failure()
        env:
          CF_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KEY_BASE: ${{ github.event.client_payload.key_base }}
        run: |
          # Delete pending entry
          curl -s -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/pending:${KEY_BASE}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" || true

          # Write failed entry (1-hour TTL via separate script call)
          python3 scripts/kv_put.py \
            --account-id "$CF_ACCOUNT_ID" \
            --namespace-id "$CF_KV_NAMESPACE_ID" \
            --api-token "$CF_API_TOKEN" \
            --key "failed:${KEY_BASE}" \
            --ttl 3600 \
            --value "{\"error\":\"yt-dlp fetch failed\",\"failed_at\":$(date +%s)}"
